services:
  omp-web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_VERSION: 1.4.3
        OMP_WEB_REF: f54521209fcdc8b7fce83d700bb16a6e8d6f2dc9
        WORKCTL_REV: 8797ac2edac87f2ce3ba16341756301a9d56a2a3
        GH_VERSION: 2.102.0
        GLAB_VERSION: 1.123.0
        UID: ${OMP_UID:-1000}
        GID: ${OMP_GID:-1000}
    ports:
      - "127.0.0.1:30141:30141"
    environment:
      OMP_WEB_AUTHENTICATED: "1"
      OMP_WEB_PASSWORD: ${OMP_WEB_PASSWORD:?Set OMP_WEB_PASSWORD in the ignored operator .env file}
      # Keep this exact hostname aligned with the public hostname and Cloudflare Access app.
      OMP_WEB_ALLOWED_HOSTS: omp-web.blima.dev
    volumes:
      - ${HOME}/.omp/agent:/home/omp/.omp/agent
      # Expose the host-authored skills inside the container without granting write access.
      - ${HOME}/.agents/skills:/home/omp/.agents/skills:ro
      # Set OMP_WEB_WORKSPACES_ROOT to the explicit host directory containing intended projects.
      # Mount at the same absolute path so existing project paths and session references remain stable.
      - ${OMP_WEB_WORKSPACES_ROOT:?Set OMP_WEB_WORKSPACES_ROOT to an explicit project directory}:${OMP_WEB_WORKSPACES_ROOT:?Set OMP_WEB_WORKSPACES_ROOT to an explicit project directory}
      - cargo-home:/home/omp/.cargo
volumes:
  cargo-home:
