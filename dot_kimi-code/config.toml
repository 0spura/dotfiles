[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "input=$(cat); cmd=$(echo \"$input\" | jq -r '.command // \"\"' 2>/dev/null || echo ''); if echo \"$cmd\" | grep -qE '(npm (install|run|test|build)|pnpm (install|run|test|build)|cargo (build|test|run)|pytest|jest|vitest)'; then [ -z \"$TMUX\" ] && echo '[Hook] Long-running command: consider tmux for session persistence' >&2; fi; true"
timeout = 5

[[hooks]]
event = "PostToolUse"
matcher = "Edit"
command = "input=$(cat); f=$(echo \"$input\" | jq -r '.file_path // \"\"' 2>/dev/null || echo ''); if [ -n \"$f\" ] && echo \"$f\" | grep -qE '\\.(js|ts|jsx|tsx|mjs|cjs)$' && [ -f \"$f\" ]; then n=$(grep -c 'console\\.log' \"$f\" 2>/dev/null || echo 0); [ \"$n\" -gt 0 ] && echo \"[Hook] $n console.log in $(basename \"$f\"): remove before committing\" >&2; fi; true"
timeout = 5

[[hooks]]
event = "PostToolUse"
matcher = "Write"
command = "input=$(cat); f=$(echo \"$input\" | jq -r '.file_path // \"\"' 2>/dev/null || echo ''); if [ -n \"$f\" ] && echo \"$f\" | grep -qE '\\.(js|ts|jsx|tsx|mjs|cjs)$' && [ -f \"$f\" ]; then n=$(grep -c 'console\\.log' \"$f\" 2>/dev/null || echo 0); [ \"$n\" -gt 0 ] && echo \"[Hook] $n console.log in $(basename \"$f\"): remove before committing\" >&2; fi; true"
timeout = 5

# Sub-agent lifecycle hooks: log start/stop for observability and cost tracking.
[[hooks]]
event = "SubagentStart"
command = "input=$(cat); name=$(echo \"$input\" | jq -r '.subagent_name // \"unknown\"' 2>/dev/null || echo 'unknown'); echo \"[subagent] started: $name\" >&2; true"
timeout = 2

[[hooks]]
event = "SubagentStop"
command = "input=$(cat); name=$(echo \"$input\" | jq -r '.subagent_name // \"unknown\"' 2>/dev/null || echo 'unknown'); status=$(echo \"$input\" | jq -r '.status // \"unknown\"' 2>/dev/null || echo 'unknown'); echo \"[subagent] stopped: $name ($status)\" >&2; true"
timeout = 2
