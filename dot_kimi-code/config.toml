default_model = "kimi-code/k3-256k"
default_permission_mode = "manual"
default_plan_mode = false
merge_all_available_skills = true
telemetry = true

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."kimi-code/k3-256k"]
provider = "managed:kimi-code"
model = "k3-256k"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use" ]
display_name = "K3 256K"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3"]
provider = "managed:kimi-code"
model = "k3"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use" ]
display_name = "K3 1M"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use" ]
display_name = "Kimi for Coding"

# Secondary model used by subagents when the secondary-model experiment is enabled.
# Cheap, fast model for execution-heavy agents (coder, apply-review, etc.).
[secondary_model]
model = "kimi-code/kimi-for-coding"
default_effort = "low"

[thinking]
enabled = true
effort = "high"
keep = "all"

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

[loop_control]
max_retries_per_step = 10
reserved_context_size = 50000

[background]
# Bumped to support parallel subagents and AgentSwarm workloads.
max_running_tasks = 8
keep_alive_on_exit = false
bash_auto_background_on_timeout = true
bash_task_timeout_s = 600

[subagent]
# 2 hours default; set to 0 for no timeout in long-running swarm sessions.
timeout_ms = 7200000

[tools]
disabled = []

