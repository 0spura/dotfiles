modelRoleStorage: global
setupVersion: 2
theme:
  dark: dark-forest
  light: light
modelRoles:
  default: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/muse-spark-1.3-contributor:low
  slow: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-sol:high
  task: opencode-go/deepseek-v4.1-flash:high
  advisor: openai-codex/gpt-6-astra:xhigh
  reviewer: openai-codex/gpt-6-sol:high
  architect: openai-codex/gpt-6-sol:high
  security: openai-codex/gpt-6-astra:xhigh
  ux: openai-codex/gpt-6-sol:medium
  scout: opencode-go/muse-spark-1.3-contributor:low
  worker: opencode-go/deepseek-v4.1-flash:high
  debug: openai-codex/gpt-6-sol:high
  perf: openai-codex/gpt-6-sol:high
  discovery: openai-codex/gpt-6-sol:high
  apply-review: opencode-go/deepseek-v4.1-flash:low
  judge: typesafe/jev-latest
  web: web/exa
tools:
  approvalMode: yolo
memory:
  backend: "off"
autolearn:
  enabled: false
task:
  batch: true
  maxConcurrency: 4
  maxRecursionDepth: 2
  enableEffort: true
  enableLsp: true
  showResolvedModelBadge: true
mcp:
  renderMarkdownResults: true
  notifications: false
  enableProjectConfig: false
skills:
  enabled: true
  enableSkillCommands: true
  enablePiUser: false
  enablePiProject: false
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
exa:
  enabled: true
web_search:
  enabled: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
statusLine:
  preset: custom
  separator: pipe
  transparent: true
  sessionAccent: false
  compactThinkingLevel: false
  leftSegments:
    - model
    - git
  rightSegments:
    - usage
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  showHookStatus: true
composer:
  tokenRate: true
tui:
  tight: true
terminal:
  showProgress: true
retry:
  fallbackChains:
    web:
      - openai-codex/gpt-6-luna
      - web/public
defaultThinkingLevel: auto
compaction:
  thresholdTokens: 150000
