modelRoleStorage: global
setupVersion: 2
theme:
  dark: dark-forest
symbolPreset: ascii
modelRoles:
  smol: opencode-go/muse-spark-1.3-contributor:low
  slow: openai-codex/gpt-6.1-sol:high
  plan: openai-codex/gpt-6.1-sol:medium
  task: opencode-go/deepseek-v4.1-flash:high
  commit: "@bulk"
  tiny: "@smol"
  advisor: "@slow"
  judge: typesafe/jev-latest
  web: web/exa
  deep: "@slow"
  judgment: openai-codex/gpt-6.1-sol:medium
  bulk: opencode-go/deepseek-v4.1-flash:high
  scan: "@smol"
  default: openai-codex/gpt-6-luna:medium
tools:
  approvalMode: yolo
memory:
  backend: "off"
autolearn:
  enabled: false
task:
  batch: true
  maxConcurrency: 4
  maxRecursionDepth: 2
  enableEffort: true
  enableLsp: true
  showResolvedModelBadge: true
mcp:
  renderMarkdownResults: true
  notifications: false
emojiAutocomplete: false
skills:
  enabled: true
  enableSkillCommands: true
exa:
  enabled: true
web_search:
  enabled: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
statusLine:
  preset: custom
  separator: pipe
  transparent: true
  sessionAccent: false
  compactThinkingLevel: false
  leftSegments:
    - model
    - git
  rightSegments:
    - usage
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  showHookStatus: true
composer:
  tokenRate: true
tui:
  tight: true
  reactions: false
terminal:
  showProgress: true
retry:
  usageAwareFallback: true
  fallbackChains:
    openai-codex/gpt-6-luna:
      - opencode-go/deepseek-v4.1-flash:high
    opencode-go/deepseek-v4.1-flash:
      - openai-codex/gpt-6-luna:medium
    web:
      - openai-codex/gpt-6-luna:low
      - web/public
  waitForUsageReset: true
  usageReservePct: 15
  usageReservePolicy: auto
compaction:
  thresholdTokens: 200000
codexResets:
  autoRedeem: "no"
dev:
  autoqaConsent: granted
defaultThinkingLevel: auto
plan:
  enabled: false
goal:
  enabled: false
  statusInFooter: false
colorBlindMode: false
title:
  refreshOnReplan: false
claudeResets:
  autoRedeem: "no"
collab:
  autoStart: control