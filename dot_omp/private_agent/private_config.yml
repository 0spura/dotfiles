modelRoleStorage: global
setupVersion: 2
theme:
  dark: dark-forest
symbolPreset: ascii
modelRoles:
  smol: openai-codex/gpt-6-luna:low
  slow: anthropic/claude-opus-5-5:medium
  plan: openai-codex/gpt-6.1-sol:medium
  task: anthropic/claude-sonnet-5-5:medium
  commit: "@bulk"
  tiny: "@smol"
  advisor: "@slow"
  judge: openai-codex/gpt-6-astra:medium
  web: web/exa
  deep: "@slow"
  judgment: openai-codex/gpt-6.1-sol:medium
  bulk: openai-codex/gpt-6-luna:low
  scan: "@smol"
  default: openai-codex/gpt-6-luna:medium
tools:
  approvalMode: yolo
memory:
  backend: "off"
autolearn:
  enabled: false
task:
  batch: true
  maxConcurrency: 4
  maxRecursionDepth: 2
  enableEffort: false
  enableLsp: true
  showResolvedModelBadge: true
mcp:
  renderMarkdownResults: true
  notifications: false
emojiAutocomplete: false
skills:
  enabled: true
  enableSkillCommands: true
exa:
  enabled: true
web_search:
  enabled: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
statusLine:
  preset: custom
  separator: pipe
  transparent: true
  sessionAccent: false
  compactThinkingLevel: false
  leftSegments:
    - model
    - git
  rightSegments:
    - usage
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  showHookStatus: true
composer:
  tokenRate: true
tui:
  tight: true
  reactions: false
terminal:
  showProgress: true
retry:
  usageAwareFallback: true
  fallbackChains:
    default:
      - openai-codex/gpt-6-luna:medium
      - anthropic/claude-sonnet-5-5:medium
    plan:
      - anthropic/claude-opus-5-5:medium
    task:
      - openai-codex/gpt-6-luna:medium
    slow:
      - openai-codex/gpt-6.1-sol:medium
    advisor:
      - openai-codex/gpt-6.1-sol:medium
    judge:
      - anthropic/claude-sonnet-5-5:medium
    judgment:
      - anthropic/claude-sonnet-5-5:medium
    smol:
      - anthropic/claude-haiku-5-5:low
    tiny:
      - anthropic/claude-haiku-5-5:low
    scan:
      - anthropic/claude-haiku-5-5:low
    bulk:
      - anthropic/claude-haiku-5-5:low
    commit:
      - anthropic/claude-haiku-5-5:low
    web:
      - openai-codex/gpt-6-luna:low
      - web/public
    anthropic/claude-opus-5-5:
      - openai-codex/gpt-6.1-sol:medium
    anthropic/claude-sonnet-5-5:
      - openai-codex/gpt-6-luna:medium
    openai-codex/gpt-6.1-sol:
      - anthropic/claude-opus-5-5:medium
    openai-codex/gpt-6-luna:
      - anthropic/claude-sonnet-5-5:medium
  waitForUsageReset: true
  usageReservePct: 1
  usageReservePolicy: auto
compaction:
  thresholdTokens: 200000
codexResets:
  autoRedeem: "no"
dev:
  autoqaConsent: granted
defaultThinkingLevel: auto
plan:
  enabled: false
goal:
  enabled: false
  statusInFooter: false
colorBlindMode: false
title:
  refreshOnReplan: false
claudeResets:
  autoRedeem: "no"
collab:
  autoStart: control
