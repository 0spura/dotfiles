<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=__FONT_DISPLAY__:wght@300;400;600;700;800&family=__FONT_BODY__:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── ENGINE: do not hand-regenerate this block, copy it. Identity lives in the vars and in appended per-slide CSS. ── */
:root{
  --bg:__BG__;--card:__CARD__;--border:__BORDER__;--sec:__SEC__;
  --fg:__FG__;--p:__PRIMARY__;--pl:__PRIMARY_LIGHT__;
  --muted:__MUTED__;--accent:__ACCENT__;--danger:__DANGER__;
  --shadow:0 2px 16px rgba(0,0,0,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:'__FONT_BODY__',sans-serif;overflow:hidden}
svg.lucide{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 80px;opacity:0;pointer-events:none;transition:opacity .45s ease}
.slide.active{opacity:1;pointer-events:all}
.hl{font-family:'__FONT_DISPLAY__',sans-serif;font-weight:800;font-size:4.8rem;line-height:1.05;letter-spacing:-.025em;text-align:center;color:var(--fg)}
.hl-lg{font-size:6.5rem}
.sub{font-family:'__FONT_DISPLAY__',sans-serif;font-weight:300;font-size:1.9rem;color:var(--muted);text-align:center;margin-top:.7rem}
.body{font-size:1.7rem;line-height:1.55;text-align:center;max-width:900px;color:var(--fg)}
.body strong{color:var(--p);font-weight:600}
.lbl{font-family:'__FONT_DISPLAY__',sans-serif;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}
#ctr{position:fixed;bottom:24px;right:36px;font-family:'__FONT_DISPLAY__',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.07em;z-index:200}
#hint{position:fixed;bottom:24px;left:36px;font-size:.8rem;color:var(--border);z-index:200}
#npanel{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(20,17,14,.96);border-top:2.5px solid var(--p);padding:20px 64px 24px;z-index:600;backdrop-filter:blur(6px)}
#npanel.open{display:block}
#nlbl{font-family:'__FONT_DISPLAY__',sans-serif;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--p);margin-bottom:9px}
#ntxt{font-size:1.18rem;line-height:1.65;color:#EDE8E0;max-width:1300px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── /ENGINE. Append per-deck identity and per-slide CSS below this line. ── */
</style>
</head>
<body>
<div id="ctr">1 / __COUNT__</div>
<div id="hint">&larr; &rarr; navegar &nbsp;&middot;&nbsp; N notas &nbsp;&middot;&nbsp; F tela cheia</div>
<div id="deck">
<!-- __SLIDES__: one <div class="slide active" id="s1"> ... </div> per outline entry, first slide carries class "active" -->
</div>
<div id="npanel">
  <div id="nlbl">Notas do apresentador</div>
  <div id="ntxt"></div>
  <div id="nhint">N para fechar</div>
</div>

<script>
const slides=Array.from(document.querySelectorAll('.slide'));
let cur=0;
const ctr=document.getElementById('ctr');
const inited=new Set();
const npanel=document.getElementById('npanel');
const ntxt=document.getElementById('ntxt');

// __NOTES__: one string per slide, same order as slides, empty string where there is none
const NOTES=[];

function updateNotes(){ntxt.textContent=NOTES[cur]||'';}

function go(n){
  if(n<0||n>=slides.length)return;
  slides[cur].classList.remove('active');
  cur=n;
  slides[cur].classList.add('active');
  ctr.textContent=(cur+1)+' / '+slides.length;
  if(!inited.has(cur)){inited.add(cur);setTimeout(()=>runAnim(cur),100);}
  if(npanel.classList.contains('open'))updateNotes();
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='n'||e.key==='N'){npanel.classList.toggle('open');updateNotes();}
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}
    else{document.exitFullscreen();}
  }
});
document.addEventListener('click',e=>{if(e.target.closest('canvas'))return;go(cur+1);});

inited.add(0);
setTimeout(()=>runAnim(0),80);

function runAnim(n){
}
</script>
</body>
</html>
