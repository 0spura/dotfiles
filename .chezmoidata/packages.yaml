packages:
  linux:
    dnf_install:
      - gh
      - git
    dnf_remove:
      - anaconda
      - anaconda-core
      - anaconda-gui
      - anaconda-live
      - anaconda-tui
      - anaconda-webui
      - gnome-contacts
      - gnome-calendar
      - gnome-clocks
      - gnome-connections
      - gnome-font-viewer
      - gnome-logs
      - rhythmbox
      - simple-scan
      - snapshot
      - mediawriter
      - yelp
      - gnome-user-docs
      - rygel
      - malcontent-control
      - gnome-abrt
      - abrt-gui
    custom:
      - name: zed
        check: "which zed"
        install: "curl -f https://zed.rs/install.sh | sh"
      - name: claude-code
        check: "command -v claude"
        install: "curl -fsSL https://claude.ai/install.sh | bash"
      - name: docker
        check: "sh -c 'docker --version >/dev/null 2>&1 && systemctl is-enabled docker >/dev/null 2>&1'"
        install: |
          if ! dnf repolist --enabled | grep -q '^docker-ce-stable'; then
            sudo dnf config-manager addrepo --from-repofile https://download.docker.com/linux/fedora/docker-ce.repo
          fi
          sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          sudo systemctl enable --now docker
          sudo usermod -aG docker "$USER"

  darwin:
    brew:
      - zed
      - gh

  windows:
    winget:
      - ZedIndustries.Zed
      - GitHub.cli
