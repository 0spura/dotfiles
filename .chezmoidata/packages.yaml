packages:
  linux:
    dnf:
      - gh
      - fzf
    custom:
      - name: zed
        check: "which zed"
        install: "curl -f https://zed.rs/install.sh | sh"

  darwin:
    brew:
      - zed
      - gh
      - fzf

  windows:
    winget:
      - Zed.Zed
      - GitHub.cli
      - junegunn.fzf
